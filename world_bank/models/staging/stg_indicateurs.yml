version: 2

models:
  - name: stg_indicateurs
    description: Indicateurs World Bank au format long, dédoublonnés.

    columns:
      - name: pays_code
        tests:
          - not_null

      - name: pays_nom

      - name: annee
        tests:
          - not_null

      - name: indicateur_code
        tests:
          - not_null

      - name: indicateur_nom

      - name: valeur